name: build-y-release

on:
  push:
    branches: [main]
    # el video promocional tiene su propio workflow
    paths-ignore:
      - "promo/**"
      - ".github/workflows/promo.yml"
  workflow_dispatch:

permissions:
  contents: write

# una compilación a la vez (dos publicando juntas a veces chocan)
concurrency:
  group: release
  cancel-in-progress: false

env:
  # FFmpeg 8.1.x (gyan.dev, espejo en GitHub). GPL. 8.1 trae gfxcapture (grabar una ventana).
  # Se usa la primera versión de esta lista fija que exista.
  FFMPEG_CANDIDATES: "8.1.3 8.1.2 8.1.1 8.1"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Bajar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ok = $false
          foreach ($v in $env:FFMPEG_CANDIDATES.Split(' ')) {
            $url = "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip"
            try {
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
              Write-Host "Bajado FFmpeg $v de $url"
              "FFMPEG_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $ok = $true
              break
            } catch {
              Write-Host "No existe $v"
            }
          }
          if (-not $ok) {
            Write-Host "Ninguna versión de la lista. Disponibles:"
            gh release list -R GyanD/codexffmpeg -L 15
            throw "No se pudo bajar FFmpeg"
          }
          (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $dir = Get-ChildItem ffx -Directory | Select-Object -First 1
          Move-Item $dir.FullName ffmpeg
          Get-ChildItem ffmpeg, ffmpeg\bin

      - name: Verificar filtros y encoders de FFmpeg
        run: |
          $ff = "ffmpeg\bin\ffmpeg.exe"
          & $ff -hide_banner -version | Select-Object -First 3
          $filters = (& $ff -hide_banner -filters) -join "`n"
          $encoders = (& $ff -hide_banner -encoders) -join "`n"
          $missing = @()
          foreach ($f in 'ddagrab', 'gfxcapture', 'scale_d3d11', 'hwmap', 'hwdownload', 'select', 'scale') {
            if ($filters -notmatch "\s$f\s") { $missing += "filtro $f" }
          }
          foreach ($e in 'h264_nvenc', 'h264_amf', 'h264_qsv', 'h264_mf', 'libx264', 'aac') {
            if ($encoders -notmatch "\s$e\s") { $missing += "encoder $e" }
          }
          if ($missing.Count -gt 0) { throw "Faltan en FFmpeg: $($missing -join ', ')" }
          Write-Host "OK: ddagrab, gfxcapture, scale_d3d11, h264_nvenc, h264_amf, h264_qsv, h264_mf, libx264"
          Write-Host "----- h264_mf (Media Foundation, informativo: el servidor no tiene placa) -----"
          & $ff -hide_banner -loglevel warning -f lavfi -i testsrc2=size=1280x720:rate=30 -t 2 -vf format=nv12 -c:v h264_mf -rate_control cbr -scenario display_remoting -b:v 6000k -g 60 -bf 0 -y mf_test.mp4
          Write-Host "h264_mf por software: código $LASTEXITCODE, $((Get-Item mf_test.mp4 -ErrorAction SilentlyContinue).Length) bytes"
          & $ff -hide_banner -loglevel warning -f lavfi -i testsrc2=size=1280x720:rate=30 -t 1 -vf format=nv12 -c:v h264_mf -hw_encoding 1 -f null -
          Write-Host "h264_mf por hardware (sin placa se espera que falle): código $LASTEXITCODE"
          $global:LASTEXITCODE = 0
          Write-Host "----- ffmpeg -h filter=gfxcapture -----"
          & $ff -hide_banner -h filter=gfxcapture
          Write-Host "----- ffmpeg -h filter=scale_d3d11 -----"
          & $ff -hide_banner -h filter=scale_d3d11
          Write-Host "----- ffmpeg -h filter=ddagrab -----"
          & $ff -hide_banner -h filter=ddagrab

      - name: Tests (lógica + pipeline real de ffmpeg con fuente de prueba)
        run: |
          $env:RCLIP_FFMPEG = (Resolve-Path ffmpeg\bin\ffmpeg.exe).Path
          cargo test --release -- --nocapture

      - name: Compilar
        run: |
          cargo build --release
          $exe = Get-Item target\release\jugadon.exe
          Write-Host ("jugadon.exe: {0:N0} bytes" -f $exe.Length)
          $desc = $exe.VersionInfo.FileDescription
          Write-Host "FileDescription: $desc"
          if ($desc -ne "Jugadón") { throw "No se embebieron el ícono/recursos en el exe" }

      - name: Prueba informativa de ddagrab en el runner (sin GPU; puede fallar)
        continue-on-error: true
        run: |
          $ff = "ffmpeg\bin\ffmpeg.exe"
          & $ff -hide_banner -loglevel warning -f lavfi -i "ddagrab=framerate=30" -t 2 -vf "hwdownload,format=bgra,scale=-2:720,format=nv12" -c:v libx264 -preset ultrafast -y dda_test.mp4
          Write-Host "exit code: $LASTEXITCODE"

      - name: Armar zip
        run: |
          New-Item -ItemType Directory Jugadon | Out-Null
          Copy-Item target\release\jugadon.exe Jugadon\
          Copy-Item ffmpeg\bin\ffmpeg.exe Jugadon\
          Copy-Item dist\LEEME.txt Jugadon\
          $lic = Get-ChildItem ffmpeg -File | Where-Object { $_.Name -match 'LICENSE' } | Select-Object -First 1
          $notice = @"
          Jugadón incluye ffmpeg.exe $env:FFMPEG_VERSION (build "essentials" de gyan.dev),
          licenciado bajo la GNU General Public License v3 (GPLv3).

          Código fuente de FFmpeg: https://ffmpeg.org/download.html
          (versión $env:FFMPEG_VERSION: https://ffmpeg.org/releases/ffmpeg-$env:FFMPEG_VERSION.tar.xz)
          Build y sus fuentes/configuración: https://www.gyan.dev/ffmpeg/builds/
          Espejo usado para bajarlo: https://github.com/GyanD/codexffmpeg/releases/tag/$env:FFMPEG_VERSION

          Texto completo de la licencia a continuación.
          ------------------------------------------------------------------
          "@
          $text = $notice
          if ($lic) { $text += "`r`n" + (Get-Content $lic.FullName -Raw) }
          Set-Content -Path Jugadon\FFMPEG-LICENCIA.txt -Value $text -Encoding utf8
          Compress-Archive -Path Jugadon -DestinationPath Jugadon-windows-x64.zip
          Get-ChildItem Jugadon | Format-Table Name, Length
          Write-Host ("zip: {0:N0} bytes" -f (Get-Item Jugadon-windows-x64.zip).Length)

      - name: Medir RAM de jugadon.exe en reposo (sin juego abierto)
        run: |
          # como en una PC donde ya se hizo la prueba de cómo grabar (si no, esos 3 s de prueba corren al abrir)
          New-Item -ItemType Directory -Force "$env:APPDATA\Jugadon" | Out-Null
          "version=4`nprobed=$env:GITHUB_RUN_NUMBER" | Set-Content "$env:APPDATA\Jugadon\config.ini"
          $p = Start-Process -FilePath Jugadon\jugadon.exe -WorkingDirectory Jugadon -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "jugadon.exe se cerró solo (código $($p.ExitCode))" }
          $p.Refresh()
          $priv = (Get-Counter "\Process(jugadon)\Working Set - Private").CounterSamples[0].CookedValue
          $cpu = $p.TotalProcessorTime.TotalMilliseconds
          $ff = @(Get-Process ffmpeg -ErrorAction SilentlyContinue)
          Write-Host ("RAM privada (lo que muestra el Administrador de tareas): {0:N0} KB" -f ($priv / 1KB))
          Write-Host ("Working set total (incluye DLLs compartidas de Windows): {0:N0} KB" -f ($p.WorkingSet64 / 1KB))
          Write-Host ("Memoria privada comprometida: {0:N0} KB" -f ($p.PrivateMemorySize64 / 1KB))
          Write-Host ("CPU usada en 25 s: {0:N0} ms" -f $cpu)
          Write-Host ("Procesos ffmpeg corriendo: {0}" -f $ff.Count)
          Stop-Process -Id $p.Id -Force
          if ($ff.Count -gt 0) { throw "En reposo no debería correr ffmpeg" }
          if ($priv -gt 4MB) { Write-Host "::warning::RAM privada en reposo por encima de 4 MB" }

      - name: Abrir la ventana "Mis clips", sacarle una foto y medir su RAM
        run: |
          $v = "$env:USERPROFILE\Videos\Jugadon"
          New-Item -ItemType Directory -Force $v | Out-Null
          $ff = "ffmpeg\bin\ffmpeg.exe"
          # clips de muestra con imágenes de prueba (para que la foto tenga algo)
          $src = 'mandelbrot=s=1280x720', 'testsrc2=s=1280x720', 'smptehdbars=s=1280x720', 'life=s=1280x720:mold=10:r=30:ratio=0.1:death_color=#C83232:life_color=#FF9A00', 'cellauto=s=1280x720:rule=110', 'rgbtestsrc=s=1280x720'
          $i = 0
          foreach ($s in $src) {
            & $ff -hide_banner -loglevel error -f lavfi -i $s -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -y "$v\clip_2026-11-1$i`_1$i-2$i-0$i.mp4"
            $i++
          }
          & $ff -hide_banner -loglevel error -f lavfi -i 'mandelbrot=s=1280x720:start_scale=0.5' -frames:v 1 -y "$v\shot_2026-11-18_22-05-00.png"
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref POINT p);
            public struct POINT { public int X, Y; }
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr h, int a, out RECT r, int s);
            public struct RECT { public int L, T, R, B; }
          }
          "@
          $p = Start-Process -FilePath Jugadon\jugadon.exe -ArgumentList "--clips" -WorkingDirectory Jugadon -PassThru
          $h = [IntPtr]::Zero
          for ($k = 0; $k -lt 30 -and $h -eq [IntPtr]::Zero; $k++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            $h = $p.MainWindowHandle
          }
          Write-Host "----- jugadon.log -----"
          Get-Content "$env:TEMP\jugadon.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($h -eq [IntPtr]::Zero) {
            Write-Host "Procesos: $(Get-Process jugadon -ErrorAction SilentlyContinue | Select-Object Id, MainWindowTitle, Responding | Out-String)"
            throw "No se abrió la ventana Mis clips"
          }
          Start-Sleep -Seconds 8
          [W]::SetForegroundWindow($h) | Out-Null
          # primera tarjeta elegida y el mouse sobre la segunda (se ven el borde y los botones)
          [W]::PostMessage($h, 0x111, [IntPtr]210, [IntPtr]::Zero) | Out-Null
          $pt = New-Object W+POINT
          $pt.X = 650; $pt.Y = 170
          [W]::ClientToScreen($h, [ref]$pt) | Out-Null
          [W]::SetCursorPos($pt.X, $pt.Y) | Out-Null
          Start-Sleep -Seconds 2
          $r = New-Object W+RECT
          # borde visible de la ventana (sin la sombra invisible que agarraría lo de atrás)
          if ([W]::DwmGetWindowAttribute($h, 9, [ref]$r, 16) -ne 0) { [W]::GetWindowRect($h, [ref]$r) | Out-Null }
          Add-Type -AssemblyName System.Drawing
          $wd = $r.R - $r.L; $ht = $r.B - $r.T
          $bmp = New-Object System.Drawing.Bitmap $wd, $ht
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
          $bmp.Save("ventana.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "Ventana: $wd x $ht"
          $c = "\Process(jugadon)\Working Set - Private"
          $open = (Get-Counter $c).CounterSamples[0].CookedValue
          [W]::PostMessage($h, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null   # WM_CLOSE = tocar la X
          Start-Sleep -Seconds 4
          $closed = (Get-Counter $c).CounterSamples[0].CookedValue
          $alive = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host ("RAM privada con la ventana abierta: {0:N0} KB" -f ($open / 1KB))
          Write-Host ("RAM privada después de cerrarla con la X: {0:N0} KB" -f ($closed / 1KB))
          if (-not $alive) { throw "Jugadón se cerró al cerrar la ventana (tenía que quedar en la bandeja)" }

      - name: Prueba completa de la app (teclas, menú con la ventana cerrada y abierta, grabar ventana, corte de golpe, salir)
        timeout-minutes: 25
        run: ./ci/e2e.ps1

      - name: Subir fotos de la prueba completa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-completa
          path: e2e/*.png
          if-no-files-found: ignore

      - name: Guardar las fotos de la ventana en el repo (solo al ejecutar a mano)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if (Test-Path ventana.png) { Copy-Item ventana.png assets\captura_ventana.png -Force }
          New-Item -ItemType Directory -Force assets\pruebas | Out-Null
          Copy-Item e2e\*.png assets\pruebas\ -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/captura_ventana.png assets/pruebas
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fotos de la ventana Mis clips (generadas en CI)"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Jugadon-windows-x64
          path: |
            Jugadon-windows-x64.zip
            ventana.png

  # La misma prueba completa en Windows Server 2022 (base de Windows 10 21H2): que ande también en PCs más viejas.
  compat:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Bajar FFmpeg 8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ok = $false
          foreach ($v in $env:FFMPEG_CANDIDATES.Split(' ')) {
            $url = "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip"
            try {
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
              Write-Host "Bajado FFmpeg $v de $url"
              "FFMPEG_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $ok = $true
              break
            } catch {
              Write-Host "No existe $v"
            }
          }
          if (-not $ok) {
            Write-Host "Ninguna versión de la lista. Disponibles:"
            gh release list -R GyanD/codexffmpeg -L 15
            throw "No se pudo bajar FFmpeg"
          }
          (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $dir = Get-ChildItem ffx -Directory | Select-Object -First 1
          Move-Item $dir.FullName ffmpeg
          Get-ChildItem ffmpeg, ffmpeg\bin

      - name: Tests
        run: |
          $env:RCLIP_FFMPEG = (Resolve-Path ffmpeg\bin\ffmpeg.exe).Path
          cargo test --release

      - name: Compilar
        run: |
          cargo build --release
          New-Item -ItemType Directory Jugadon | Out-Null
          Copy-Item target\release\jugadon.exe, ffmpeg\bin\ffmpeg.exe Jugadon\

      - name: Prueba completa de la app en Windows Server 2022
        timeout-minutes: 25
        run: ./ci/e2e.ps1

      - name: Subir fotos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-completa-2022
          path: e2e/*.png
          if-no-files-found: ignore

  # Se publica solo si la prueba completa pasó en las dos versiones de Windows.
  publish:
    needs: [windows, compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jugadon-windows-x64

      - name: Publicar release
        id: rel
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jugadón v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          files: Jugadon-windows-x64.zip
          body: |
            ## Jugadón: clips de juegos livianos para Windows 10/11

            **Cómo instalar:** bajá **Jugadon-windows-x64.zip** (abajo, en *Assets*), descomprimilo en una carpeta y abrí `jugadon.exe`. No necesita instalación.
            Si Windows dice "Windows protegió su PC": **Más información → Ejecutar de todas formas** (el programa no está firmado).

            | Tecla | Qué hace |
            |---|---|
            | **F9** | Guarda los últimos segundos como clip |
            | **F8** | Graba la pantalla (o una ventana) hasta que la frenás |
            | **F10** | Captura de pantalla |

            - Clic en el ícono (al lado del reloj): ventana **Mis clips**. Tocás un clip y lo ves y recortás ahí mismo; el botón 🔗 copia un link que abre cualquiera, tenga o no la app. Clic derecho: menú.
            - Ícono **gris** = en pausa (sin juego, no consume nada) · **naranja** = clips activos · **rojo** = grabando.
            - El video lo comprime la placa de video (NVIDIA, AMD o Intel). Gratis y sin cuentas.

            Instrucciones completas en el [README](https://github.com/${{ github.repository }}#readme) y en `LEEME.txt` dentro del zip.

            <sub>Compilado desde el commit ${{ github.sha }}.</sub>

      - name: Esperar y reintentar la publicación
        if: steps.rel.outcome == 'failure'
        run: sleep 30

      - name: Publicar release (reintento)
        if: steps.rel.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jugadón v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          files: Jugadon-windows-x64.zip
          body: |
            ## Jugadón: clips de juegos livianos para Windows 10/11

            **Cómo instalar:** bajá **Jugadon-windows-x64.zip** (abajo, en *Assets*), descomprimilo en una carpeta y abrí `jugadon.exe`. No necesita instalación.
            Si Windows dice "Windows protegió su PC": **Más información → Ejecutar de todas formas** (el programa no está firmado).

            | Tecla | Qué hace |
            |---|---|
            | **F9** | Guarda los últimos segundos como clip |
            | **F8** | Graba la pantalla (o una ventana) hasta que la frenás |
            | **F10** | Captura de pantalla |

            - Clic en el ícono (al lado del reloj): ventana **Mis clips**. Tocás un clip y lo ves y recortás ahí mismo; el botón 🔗 copia un link que abre cualquiera, tenga o no la app. Clic derecho: menú.
            - Ícono **gris** = en pausa (sin juego, no consume nada) · **naranja** = clips activos · **rojo** = grabando.
            - El video lo comprime la placa de video (NVIDIA, AMD o Intel). Gratis y sin cuentas.

            Instrucciones completas en el [README](https://github.com/${{ github.repository }}#readme) y en `LEEME.txt` dentro del zip.

            <sub>Compilado desde el commit ${{ github.sha }}.</sub>
